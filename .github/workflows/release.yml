name: release

# Publishing is deliberately tag-driven rather than push-to-main: a version going out
# should be a decision someone made, not a side effect of merging.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pack and inspect the tarball without publishing"
        type: boolean
        default: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # OIDC, for npm trusted publishing and provenance. No NPM_TOKEN needed once the
      # package is configured to trust this repo + workflow on npmjs.com.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      # npm is only the publisher here; the package itself runs on Bun.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # OIDC trusted publishing needs npm >= 11.5.1; Node 22 still ships npm 10, which silently
      # falls back to token auth (ENEEDAUTH) even when trusted publishing is configured.
      - run: npm install -g npm@latest

      - run: bun install --frozen-lockfile

      - name: the tag must match the version being published
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag v$tag does not match package.json version $pkg" >&2
            exit 1
          fi
          echo "publishing $pkg"

      # Never publish something that does not pass its own gate.
      - run: bun run typecheck
      - run: bun test

      # web/dist is gitignored, so a fresh checkout has no bundle. The server would build
      # it on first boot anyway, but shipping it prebuilt means the first page load of a
      # published install is not waiting on a compile.
      - run: bun run build:web

      - name: what would ship
        run: npm pack --dry-run

      - name: publish
        if: startsWith(github.ref, 'refs/tags/')
        run: npm publish --access public --provenance
        env:
          # Only used if trusted publishing is not configured; harmless when unset.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
