name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pack and inspect the tarball without publishing"
        type: boolean
        default: true

# A second push to the same branch makes the first run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      # --frozen-lockfile is the point of CI installing at all: it fails when
      # bun.lock and package.json disagree, rather than quietly resolving something
      # nobody has run locally.
      - run: bun install --frozen-lockfile

      - run: bun run typecheck

      # The bundle builds on first boot too, but building it here means a broken
      # web/canvas.ts fails the build rather than a human's first page load.
      - run: bun run build:web

      - run: bun test

  external-client:
    # The MCP surface driven by a client that is not our own SDK. This is the job that
    # catches a client omitting the JSON-RPC `arguments` key — the SDK-based tests cannot
    # see that, because that client always sends `arguments: {}`.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - run: bun install --frozen-lockfile

      # mcpt ships as a Go program; `go install` avoids a macOS runner just for brew.
      # The script expects the binary to be named `mcpt`.
      - name: install mcpt
        run: |
          go install github.com/f/mcptools/cmd/mcptools@latest
          ln -s "$(go env GOPATH)/bin/mcptools" "$(go env GOPATH)/bin/mcpt"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - run: mcpt version
      - run: bash test/mcpt-loop.sh

  # Publishing is tag-driven: a version going out is a decision (someone pushed a vX.Y.Z tag),
  # not a side effect of merging. It only runs after the gate passes. npm trusted publishing (OIDC)
  # authenticates it — no NPM_TOKEN — so the trusted-publisher config on npmjs must name THIS
  # workflow file (ci.yml).
  publish:
    needs: gate
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # OIDC, for npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      # npm is only the publisher here; the package itself runs on Bun.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # OIDC trusted publishing needs npm >= 11.5.1; Node 22 still ships npm 10, which silently
      # falls back to token auth (ENEEDAUTH) even when trusted publishing is configured.
      - run: npm install -g npm@latest

      - run: bun install --frozen-lockfile

      - name: the tag must match the version being published
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag v$tag does not match package.json version $pkg" >&2
            exit 1
          fi
          echo "publishing $pkg"

      # web/dist is gitignored, so a fresh checkout has no bundle. Shipping it prebuilt means the
      # first page load of a published install is not waiting on a compile.
      - run: bun run build:web

      - name: what would ship
        run: npm pack --dry-run

      - name: publish
        run: npm publish --access public --provenance
