name: ci

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch makes the first run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      # --frozen-lockfile is the point of CI installing at all: it fails when
      # bun.lock and package.json disagree, rather than quietly resolving something
      # nobody has run locally.
      - run: bun install --frozen-lockfile

      - run: bun run typecheck

      # The bundle builds on first boot too, but building it here means a broken
      # web/canvas.ts fails the build rather than a human's first page load.
      - run: bun run build:web

      - run: bun test

  external-client:
    # The MCP surface driven by a client that is not our own SDK. This is the job that
    # catches a client omitting the JSON-RPC `arguments` key — the SDK-based tests cannot
    # see that, because that client always sends `arguments: {}`.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - run: bun install --frozen-lockfile

      # mcpt ships as a Go program; `go install` avoids a macOS runner just for brew.
      # The script expects the binary to be named `mcpt`.
      - name: install mcpt
        run: |
          go install github.com/f/mcptools/cmd/mcptools@latest
          ln -s "$(go env GOPATH)/bin/mcptools" "$(go env GOPATH)/bin/mcpt"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - run: mcpt version
      - run: bash test/mcpt-loop.sh
