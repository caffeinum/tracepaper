<!doctype html>
<html>
<head><meta charset="utf-8"><title>Pricing</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 48px; background: #fafafa; color: #111; }
  h1 { font-size: 40px; margin: 0 0 8px; }
  p.lede { color: #555; margin: 0 0 40px; }
  .tiers { display: flex; gap: 24px; }
  .tier { flex: 1; background: #fff; border: 1px solid #ddd; border-radius: 12px; padding: 24px; }
  .price { font-size: 32px; font-weight: 700; }
  .cta { margin-top: 64px; }
  .cta a { display: inline-block; padding: 12px 24px; background: #888; color: #fff; border-radius: 8px; text-decoration: none; }
</style></head>
<body>
  <h1>Simple pricing for growing teams</h1>
  <p class="lede">Start free, upgrade when you need more.</p>
  <div class="tiers">
    <div class="tier"><h2>Starter</h2><div class="price">$0</div><p>1 project, community support</p></div>
    <div class="tier"><h2>Team</h2><div class="price">$29</div><p>10 projects, email support</p></div>
    <div class="tier"><h2>Enterprise</h2><div class="price">Call us</div><p>Unlimited, SSO, SLA</p></div>
  </div>
  <div class="cta"><a href="#">Start your free trial</a></div>
</body>
</html>
